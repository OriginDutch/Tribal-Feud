# Every push and pull request: typecheck, unit tests, build and the browser smoke test.
# The deploy workflow only runs when this passes.
name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test (the built game in a real browser)
        run: npm run smoke
